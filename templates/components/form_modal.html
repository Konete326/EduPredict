<div id="form-modal" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="form-modal-title">
  <div data-modal-backdrop="form-modal" class="fixed inset-0 bg-[var(--bg-overlay)] backdrop-blur-sm transition-opacity" onclick="closeFormModal()"></div>
  <div class="pointer-events-none flex min-h-full w-full items-center justify-center p-4">
    <div class="pointer-events-auto relative z-10 w-full max-w-lg rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-xl">
      <div class="flex items-center justify-between border-b border-[var(--border-subtle)] px-6 py-4">
        <h3 id="form-modal-title" class="text-base font-semibold text-[var(--text-primary)]">Form</h3>
        <button type="button" onclick="closeFormModal()" aria-label="Close modal" class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-[var(--text-muted)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <form id="form-modal-element" method="post" action="" class="space-y-4 p-6">
        {% csrf_token %}
        <div id="form-modal-fields" class="space-y-4"></div>
        <div class="flex items-center justify-end gap-3 border-t border-[var(--border-subtle)] pt-4">
          <button type="button" onclick="closeFormModal()" class="inline-flex items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-4 py-2 text-sm font-medium text-[var(--text-primary)] transition-colors hover:bg-[var(--bg-elevated)]">Cancel</button>
          <button id="form-modal-submit-btn" type="submit" class="inline-flex items-center justify-center rounded-lg bg-[var(--accent-primary)] px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-[var(--accent-hover)]">Submit</button>
        </div>
      </form>
    </div>
  </div>
</div>
