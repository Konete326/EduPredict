<header class="sticky top-0 z-20 flex h-16 shrink-0 items-center justify-between gap-3 border-b border-[var(--border-subtle)] bg-[var(--bg-surface)] px-4 backdrop-blur sm:px-6 lg:px-8">
  <div class="flex items-center gap-3 min-w-0">
    <button id="mobile-sidebar-toggle" type="button" class="inline-flex items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] p-2 text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)] transition-colors" title="Show or hide menu" aria-label="Show or hide menu" aria-controls="mobile-sidebar-drawer" aria-expanded="true">
      <i class="fa-solid fa-bars text-sm"></i>
    </button>
    <div class="min-w-0">
      <h1 class="truncate text-base font-semibold tracking-tight text-[var(--text-primary)] sm:text-lg">
        {{ page_title|default:"EduPredict" }}
      </h1>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3 shrink-0">
    <div class="relative hidden md:block">
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs text-[var(--text-muted)]"></i>
      <input type="search" data-table-search="" placeholder="Quick search..." aria-label="Quick search" class="w-48 lg:w-64 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] py-1.5 pl-8 pr-3 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] focus:border-[var(--accent-primary)] focus:outline-none">
    </div>

    <div class="inline-flex items-center gap-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2.5 py-1.5 text-xs font-medium text-[var(--text-secondary)]" title="{% if db_connected %}MongoDB Connected{% else %}MongoDB Offline{% endif %}">
      <span class="h-2 w-2 rounded-full {% if db_connected %}bg-[var(--status-success)]{% else %}bg-[var(--status-warning)]{% endif %}"></span>
      <span class="hidden sm:inline">{% if db_connected %}DB Ready{% else %}DB Offline{% endif %}</span>
    </div>

    <div class="relative">
      <button id="notification-bell-btn" type="button" aria-expanded="false" aria-haspopup="true" aria-label="Notifications" title="Notifications" class="relative inline-flex items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] p-2 text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)] transition-colors">
        <i class="fa-regular fa-bell text-sm"></i>
        {% if unread_notifications_count %}
        <span id="notification-unread-badge" class="absolute -right-1 -top-1 flex h-4 min-w-[1rem] items-center justify-center rounded-full bg-[var(--status-danger)] px-1 text-[10px] font-semibold tabular-nums text-white">
          {{ unread_notifications_count }}
        </span>
        {% else %}
        <span id="notification-unread-badge" class="hidden absolute -right-1 -top-1 flex h-4 min-w-[1rem] items-center justify-center rounded-full bg-[var(--status-danger)] px-1 text-[10px] font-semibold tabular-nums text-white">
          0
        </span>
        {% endif %}
      </button>

      <div id="notification-dropdown" class="hidden absolute right-0 mt-2 w-72 sm:w-80 z-40 overflow-hidden rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-xl">
        <div class="flex items-center justify-between border-b border-[var(--border-subtle)] px-4 py-2.5">
          <span class="text-xs font-semibold uppercase tracking-wider text-[var(--text-secondary)]">Alerts</span>
          <button id="mark-notifications-read-btn" type="button" class="text-xs font-medium text-[var(--accent-primary)] hover:text-[var(--accent-hover)]">
            Mark all read
          </button>
        </div>
        <div id="notification-list" class="max-h-72 divide-y divide-[var(--border-subtle)] overflow-y-auto">
          {% for notif in unread_notifications %}
          <div class="flex items-start gap-2.5 px-4 py-3 hover:bg-[var(--bg-elevated)]">
            <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full {% if notif.severity == 'DANGER' %}bg-[var(--status-danger)]{% elif notif.severity == 'WARNING' %}bg-[var(--status-warning)]{% else %}bg-[var(--accent-primary)]{% endif %}"></span>
            <div class="min-w-0 flex-1">
              <p class="truncate text-xs font-semibold text-[var(--text-primary)]">{{ notif.title|default:"Alert" }}</p>
              <p class="mt-0.5 text-xs text-[var(--text-secondary)]">{{ notif.message }}</p>
            </div>
          </div>
          {% empty %}
          <div class="px-4 py-6 text-center text-xs text-[var(--text-muted)]">
            No new alerts.
          </div>
          {% endfor %}
        </div>
      </div>
    </div>

    <button id="theme-toggle-btn" type="button" aria-pressed="false" aria-label="Switch theme" title="Switch Light or Dark theme" class="inline-flex items-center gap-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2.5 py-1.5 text-xs font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)] transition-colors">
      <i id="theme-icon-moon" class="fa-solid fa-moon text-sm"></i>
      <i id="theme-icon-sun" class="fa-solid fa-sun hidden text-sm text-[var(--status-warning)]"></i>
      <span id="theme-toggle-label" class="hidden sm:inline">Dark</span>
    </button>
  </div>
</header>
