<div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
  <div data-modal-backdrop="confirm-modal" class="fixed inset-0 bg-[var(--bg-overlay)] backdrop-blur-sm transition-opacity" onclick="closeConfirmModal()"></div>
  <div class="pointer-events-none flex min-h-full w-full items-center justify-center p-4">
    <div class="pointer-events-auto relative z-10 w-full max-w-md rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-6 shadow-xl">
      <div class="flex items-start justify-between gap-4">
        <div class="flex items-start gap-3">
          <span class="mt-0.5 inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-elevated)] text-[var(--status-danger)]" aria-hidden="true">
            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
          </span>
          <div>
            <h3 id="confirm-modal-title" class="text-base font-semibold text-[var(--text-primary)]">Confirm Action</h3>
            <p id="confirm-modal-message" class="mt-1.5 text-sm leading-relaxed text-[var(--text-secondary)]">Are you sure you want to proceed?</p>
          </div>
        </div>
        <button type="button" onclick="closeConfirmModal()" aria-label="Close modal" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[var(--text-muted)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div class="mt-6 flex items-center justify-end gap-3">
        <button type="button" onclick="closeConfirmModal()" class="inline-flex items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-4 py-2 text-sm font-medium text-[var(--text-primary)] transition-colors hover:bg-[var(--bg-elevated)]">Cancel</button>
        <form id="confirm-modal-form" method="post" action="">
          {% csrf_token %}
          <button id="confirm-modal-submit-btn" type="submit" class="inline-flex items-center justify-center rounded-lg bg-[var(--status-danger)] px-4 py-2 text-sm font-semibold text-white transition-opacity hover:opacity-90">Confirm</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="coming-soon-modal" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="coming-soon-modal-title" aria-hidden="true">
  <div data-modal-backdrop="coming-soon-modal" class="fixed inset-0 bg-[var(--bg-overlay)] backdrop-blur-sm transition-opacity" onclick="closeComingSoonModal()"></div>
  <div class="pointer-events-none flex min-h-full w-full items-center justify-center p-4">
    <div class="pointer-events-auto relative z-10 w-full max-w-md rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-6 shadow-xl">
      <div class="flex items-start justify-between gap-4">
        <div class="flex items-start gap-3 min-w-0">
          <span class="mt-0.5 inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--accent-soft)] text-[var(--accent-primary)]" aria-hidden="true">
            <i class="fa-solid fa-rocket text-sm"></i>
          </span>
          <div class="min-w-0 space-y-1">
            <span id="coming-soon-modal-panel" class="inline-flex items-center gap-1.5 rounded-md border border-[var(--border-subtle)] bg-[var(--accent-soft)] px-2 py-0.5 text-[11px] font-semibold uppercase tracking-wider text-[var(--accent-primary)]">Coming Soon</span>
            <h3 id="coming-soon-modal-title" class="text-base font-semibold text-[var(--text-primary)]">Module In Development</h3>
          </div>
        </div>
        <button type="button" onclick="closeComingSoonModal()" aria-label="Close modal" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[var(--text-muted)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <p id="coming-soon-modal-desc" class="mt-3 text-sm leading-relaxed text-[var(--text-secondary)]">This module is scheduled for an upcoming sprint and will integrate live MongoDB records and automated workflows.</p>
      <div class="mt-4 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-elevated)] p-3.5">
        <p class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">Planned Capabilities</p>
        <ul id="coming-soon-modal-features" class="space-y-1.5 text-xs text-[var(--text-secondary)]"></ul>
      </div>
      <div class="mt-5 flex items-center justify-end gap-2">
        <button type="button" onclick="closeComingSoonModal()" class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-[var(--accent-primary)] px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-[var(--accent-hover)]">
          <i class="fa-solid fa-check text-xs"></i>
          <span>Got It</span>
        </button>
      </div>
    </div>
  </div>
</div>
