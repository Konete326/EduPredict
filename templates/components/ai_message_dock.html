<div id="ep-agent-dock-root" class="fixed bottom-4 right-4 z-40 print:hidden">
  <section id="ep-agent-chat-panel" aria-label="AI Specialist Chat" aria-hidden="true" class="hidden absolute bottom-[calc(100%+3.75rem)] right-0 z-40 w-[22rem] sm:w-[24.5rem] max-w-[calc(100vw-2rem)] flex-col overflow-hidden rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-xl">
    <header class="flex items-center justify-between gap-2 border-b border-[var(--border-subtle)] bg-[var(--bg-surface)] px-3.5 py-2.5">
      <div class="flex min-w-0 items-center gap-2.5">
        <img id="ep-chat-agent-dp" class="h-9 w-9 shrink-0 rounded-full border border-[var(--border-subtle)] object-cover" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2040%2040'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%2316a34a'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%23059669'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'40'%20height%3D'40'%20rx%3D'20'%20fill%3D'url(%23g)'%2F%3E%3Cpath%20d%3D'M20%2011L9%2016l11%205%2011-5-11-5zm-6%207.5v4.5c0%201.8%202.7%203%206%203s6-1.2%206-3v-4.5l-6%202.8-6-2.8z'%20fill%3D'%23ffffff'%2F%3E%3C%2Fsvg%3E" alt="EduCoach AI">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-1.5">
            <h3 id="ep-chat-agent-name" class="truncate text-xs font-semibold text-[var(--text-primary)]">EduCoach AI</h3>
            <span class="shrink-0 rounded-full border border-[var(--border-subtle)] bg-[var(--bg-elevated)] px-1.5 py-0.5 text-[9px] font-medium text-[var(--status-success)]">Active Chat</span>
          </div>
          <p id="ep-chat-agent-role" class="truncate text-[11px] text-[var(--text-muted)]">Academic &amp; Study Advisor</p>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-1">
        <button id="ep-dock-clear-btn" type="button" title="Reset conversation" aria-label="Reset conversation" class="inline-flex items-center gap-1 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2 py-1 text-[11px] font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-rotate-left text-[10px]" aria-hidden="true"></i>
          <span>Reset</span>
        </button>
        <button id="ep-dock-close-btn" type="button" title="End and clear chat" aria-label="End and clear chat" class="inline-flex items-center gap-1 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2 py-1 text-[11px] font-medium text-[var(--text-muted)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
          <span class="sr-only">End &amp; Clear</span>
        </button>
      </div>
    </header>

    <div id="ep-zig-zag-stream" class="h-72 overflow-y-auto bg-[var(--bg-canvas)] p-3 space-y-2.5 text-xs" aria-live="polite">
      <div data-dock-empty class="flex h-full flex-col items-center justify-center gap-1.5 px-4 text-center text-[var(--text-muted)]">
        <i class="fa-solid fa-comments text-lg text-[var(--accent-primary)]" aria-hidden="true"></i>
        <p class="text-xs font-medium text-[var(--text-primary)]">Pick an EduPredict AI Agent</p>
        <p class="text-[11px] leading-relaxed">Select an agent below or type your request. Specialists auto-route and can run portal actions.</p>
      </div>
    </div>

    <footer class="flex items-center justify-between gap-2 border-t border-[var(--border-subtle)] bg-[var(--bg-surface)] px-3.5 py-1.5 text-[10px] text-[var(--text-muted)]">
      <span>History stays active during chat; Reset or Close to wipe.</span>
      <span id="ep-dock-engine-badge" title="AI assistant ready" class="inline-flex shrink-0 items-center gap-1 font-medium text-[var(--status-success)]">
        <span id="ep-dock-engine-dot" class="h-1.5 w-1.5 rounded-full bg-[var(--status-success)]" aria-hidden="true"></span>
        <span id="ep-dock-engine-label">Live AI</span>
      </span>
    </footer>
  </section>

  <div id="ep-message-dock" aria-hidden="true" class="hidden absolute bottom-[calc(100%+0.5rem)] right-0 z-40 max-w-[calc(100vw-2rem)] items-center gap-1.5 sm:gap-2 rounded-full border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-2.5 sm:px-3 py-1.5 shadow-lg">
    <div class="flex shrink-0 items-center gap-1.5" role="group" aria-label="AI Agents">
      <button type="button" data-dock-agent="coach" aria-pressed="false" title="EduCoach AI — Academic & Study Advisor" aria-label="EduCoach AI — Academic & Study Advisor" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <img data-dock-avatar class="h-8 w-8 rounded-full object-cover" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2040%2040'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%2316a34a'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%23059669'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'40'%20height%3D'40'%20rx%3D'20'%20fill%3D'url(%23g)'%2F%3E%3Cpath%20d%3D'M20%2011L9%2016l11%205%2011-5-11-5zm-6%207.5v4.5c0%201.8%202.7%203%206%203s6-1.2%206-3v-4.5l-6%202.8-6-2.8z'%20fill%3D'%23ffffff'%2F%3E%3C%2Fsvg%3E" alt="EduCoach AI">
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
      <button type="button" data-dock-agent="analyst" aria-pressed="false" title="PulseML AI — Predictive Risk & Data Agent" aria-label="PulseML AI — Predictive Risk & Data Agent" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <img data-dock-avatar class="h-8 w-8 rounded-full object-cover" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2040%2040'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%232563eb'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%231d4ed8'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'40'%20height%3D'40'%20rx%3D'20'%20fill%3D'url(%23g)'%2F%3E%3Cpath%20d%3D'M10%2026h20M11%2022l5-6%204.5%203.5L28%2013'%20fill%3D'none'%20stroke%3D'%23ffffff'%20stroke-width%3D'2.5'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3Ccircle%20cx%3D'28'%20cy%3D'13'%20r%3D'2.4'%20fill%3D'%23ffffff'%2F%3E%3C%2Fsvg%3E" alt="PulseML AI">
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
      <button type="button" data-dock-agent="ops" aria-pressed="false" title="CourseOps AI — Course, Roster & Marks Agent" aria-label="CourseOps AI — Course, Roster & Marks Agent" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <img data-dock-avatar class="h-8 w-8 rounded-full object-cover" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2040%2040'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%23d97706'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%23b45309'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'40'%20height%3D'40'%20rx%3D'20'%20fill%3D'url(%23g)'%2F%3E%3Crect%20x%3D'12'%20y%3D'11'%20width%3D'16'%20height%3D'18'%20rx%3D'3'%20fill%3D'none'%20stroke%3D'%23ffffff'%20stroke-width%3D'2.3'%2F%3E%3Cpath%20d%3D'M16%2011h8v3h-8z'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M16%2020l2.5%202.5L24%2017'%20fill%3D'none'%20stroke%3D'%23ffffff'%20stroke-width%3D'2.3'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E" alt="CourseOps AI">
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
      <button type="button" data-dock-agent="desk" aria-pressed="false" title="HelpDesk AI — Portal Guide, PDF & Support Agent" aria-label="HelpDesk AI — Portal Guide, PDF & Support Agent" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <img data-dock-avatar class="h-8 w-8 rounded-full object-cover" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2040%2040'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'1'%20y2%3D'1'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%23dc2626'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%23b91c1c'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'40'%20height%3D'40'%20rx%3D'20'%20fill%3D'url(%23g)'%2F%3E%3Cpath%20d%3D'M12%2021v-2a8%208%200%200%201%2016%200v2'%20fill%3D'none'%20stroke%3D'%23ffffff'%20stroke-width%3D'2.4'%20stroke-linecap%3D'round'%2F%3E%3Crect%20x%3D'10'%20y%3D'19'%20width%3D'4'%20height%3D'7'%20rx%3D'2'%20fill%3D'%23ffffff'%2F%3E%3Crect%20x%3D'26'%20y%3D'19'%20width%3D'4'%20height%3D'7'%20rx%3D'2'%20fill%3D'%23ffffff'%2F%3E%3Cpath%20d%3D'M28%2026c0%202.2-1.8%203.5-4.5%203.5H20'%20fill%3D'none'%20stroke%3D'%23ffffff'%20stroke-width%3D'2.2'%20stroke-linecap%3D'round'%2F%3E%3C%2Fsvg%3E" alt="HelpDesk AI">
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
    </div>

    <span class="h-6 w-px shrink-0 bg-[var(--border-subtle)]" aria-hidden="true"></span>

    <form id="ep-dock-form" data-no-lock class="flex flex-1 min-w-0 items-center gap-1.5">
      <input id="ep-dock-input" type="text" autocomplete="off" placeholder="Select an agent or type a message..." aria-label="Message AI assistant" class="w-20 sm:w-48 min-w-0 flex-1 bg-transparent px-1.5 py-1 text-xs text-[var(--text-primary)] placeholder:text-[var(--text-muted)] focus:outline-none">
      <button id="ep-dock-send" type="submit" title="Send message" aria-label="Send message" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[var(--accent-primary)] text-white shadow-sm transition-colors hover:bg-[var(--accent-hover)] disabled:opacity-50">
        <i class="fa-solid fa-paper-plane text-xs" aria-hidden="true"></i>
      </button>
    </form>
  </div>

  <button id="ep-agent-dock-toggle" type="button" title="Drag to move or click to open AI Assistants" aria-label="AI Assistants" aria-expanded="false" aria-controls="ep-message-dock" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-[var(--border-subtle)] bg-[var(--accent-primary)] text-white shadow-md hover:bg-[var(--accent-hover)] cursor-grab active:cursor-grabbing select-none touch-none transition-transform active:scale-95">
    <i class="fa-solid fa-comments text-base pointer-events-none" aria-hidden="true"></i>
  </button>
</div>
