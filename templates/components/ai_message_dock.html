<div id="ep-agent-dock-root" class="fixed bottom-4 right-4 z-40 print:hidden">
  <style>
    @keyframes epAvatarBob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.04); }
    }
    @keyframes epAvatarWave {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-1.5px) rotate(-4deg); }
      75% { transform: translateY(-1.5px) rotate(4deg); }
    }
    @keyframes epHeadBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
    @keyframes epBlink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
    @keyframes epMouth { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.18, 0.8); } 90% { transform: scale(0.9, 1.2); } }
    @keyframes epAntenna { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.5px) scale(1.2); } }
    @keyframes epMicPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.35); }
      50% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); }
    }
    .ep-av { width: 100%; height: 100%; display: block; overflow: visible; }
    .ep-av-head, .ep-av-eye, .ep-av-mouth, .ep-av-antenna, .ep-bot-head, .ep-bot-eye { transform-box: fill-box; transform-origin: center; }
    .ep-av-head { animation: epHeadBob 3.4s ease-in-out infinite; }
    .ep-av-eye, .ep-bot-eye { animation: epBlink 4s ease-in-out infinite; }
    .ep-av-mouth { animation: epMouth 5s ease-in-out infinite; }
    .ep-av-antenna { animation: epAntenna 1.8s ease-in-out infinite; }
    .ep-bot-head { animation: epHeadBob 3s ease-in-out infinite; }
    [data-dock-agent="analyst"] .ep-av-head, [data-dock-agent="analyst"] .ep-av-eye { animation-delay: 0.45s; }
    [data-dock-agent="ops"] .ep-av-head, [data-dock-agent="ops"] .ep-av-eye { animation-delay: 0.9s; }
    [data-dock-agent="desk"] .ep-av-head, [data-dock-agent="desk"] .ep-av-eye { animation-delay: 1.35s; }
    [data-dock-agent="analyst"] .ep-avatar-anim { animation-delay: 0.45s; }
    [data-dock-agent="ops"] .ep-avatar-anim { animation-delay: 0.9s; }
    [data-dock-agent="desk"] .ep-avatar-anim { animation-delay: 1.35s; }
    .ep-toggle-avatar-anim { animation: epAvatarWave 4.2s ease-in-out infinite; }
    .ep-mic-listening {
      animation: epMicPulse 1.2s ease-in-out infinite;
      background-color: var(--status-danger);
      border-color: var(--status-danger);
      color: #ffffff;
    }
    @media (prefers-reduced-motion: reduce) {
      .ep-toggle-avatar-anim, .ep-mic-listening, .ep-av-head, .ep-av-eye, .ep-av-mouth, .ep-av-antenna, .ep-bot-head, .ep-bot-eye { animation: none; }
    }
  </style>

  <section id="ep-agent-chat-panel" aria-label="AI Specialist Chat" aria-hidden="true" class="hidden absolute bottom-[calc(100%+3.75rem)] right-0 z-40 w-[22rem] sm:w-[24.5rem] max-w-[calc(100vw-2rem)] flex-col overflow-hidden rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-xl">
    <header class="flex items-center justify-between gap-2 border-b border-[var(--border-subtle)] bg-[var(--bg-surface)] px-3.5 py-2.5">
      <div class="flex min-w-0 items-center gap-2.5">
        <span id="ep-chat-agent-dp" data-avatar-agent="coach" class="ep-av-wrap inline-flex h-9 w-9 shrink-0 rounded-full border border-[var(--border-subtle)]"></span>
        <div class="min-w-0">
          <h3 id="ep-chat-agent-name" class="truncate text-xs font-semibold text-[var(--text-primary)]">EduCoach AI</h3>
          <p id="ep-chat-agent-role" class="truncate text-[11px] text-[var(--text-muted)]">Academic &amp; Study Advisor</p>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-1">
        <button id="ep-dock-clear-btn" type="button" title="Reset conversation" aria-label="Reset conversation" class="inline-flex items-center gap-1 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2 py-1 text-[11px] font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-rotate-left text-[10px]" aria-hidden="true"></i>
          <span>Reset</span>
        </button>
        <button id="ep-dock-close-btn" type="button" title="End and clear chat" aria-label="End and clear chat" class="inline-flex items-center gap-1 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2 py-1 text-[11px] font-medium text-[var(--text-muted)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
          <span class="sr-only">End &amp; Clear</span>
        </button>
      </div>
    </header>

    <div id="ep-zig-zag-stream" class="h-72 overflow-y-auto bg-[var(--bg-canvas)] p-3 space-y-2.5 text-xs" aria-live="polite">
      <div data-dock-empty class="flex h-full flex-col items-center justify-center gap-1.5 px-4 text-center text-[var(--text-muted)]">
        <i class="fa-solid fa-comments text-lg text-[var(--accent-primary)]" aria-hidden="true"></i>
        <p class="text-xs font-medium text-[var(--text-primary)]">Pick an EduPredict Assistant</p>
        <p class="text-[11px] leading-relaxed">Select an agent below, type, or use the mic to talk.</p>
      </div>
    </div>
  </section>

  <div id="ep-message-dock" aria-hidden="true" class="hidden flex-wrap absolute bottom-[calc(100%+0.5rem)] right-0 z-40 max-w-[calc(100vw-2rem)] items-center gap-1.5 sm:gap-2 rounded-3xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-2.5 sm:px-3 py-1.5 shadow-lg">
    <div class="flex shrink-0 items-center gap-1.5" role="group" aria-label="AI Agents">
      <button type="button" data-dock-agent="coach" aria-pressed="false" title="EduCoach AI — Academic & Study Advisor" aria-label="EduCoach AI — Academic & Study Advisor" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <span data-dock-avatar data-avatar-agent="coach" class="ep-av-wrap inline-flex h-8 w-8 rounded-full"></span>
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
      <button type="button" data-dock-agent="analyst" aria-pressed="false" title="PulseML AI — Predictive Risk & Data Agent" aria-label="PulseML AI — Predictive Risk & Data Agent" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <span data-dock-avatar data-avatar-agent="analyst" class="ep-av-wrap inline-flex h-8 w-8 rounded-full"></span>
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
      <button type="button" data-dock-agent="ops" aria-pressed="false" title="CourseOps AI — Course, Roster & Marks Agent" aria-label="CourseOps AI — Course, Roster & Marks Agent" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <span data-dock-avatar data-avatar-agent="ops" class="ep-av-wrap inline-flex h-8 w-8 rounded-full"></span>
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
      <button type="button" data-dock-agent="desk" aria-pressed="false" title="HelpDesk AI — Portal Guide, PDF & Support Agent" aria-label="HelpDesk AI — Portal Guide, PDF & Support Agent" class="relative inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full transition-transform hover:scale-105 focus:outline-none">
        <span data-dock-avatar data-avatar-agent="desk" class="ep-av-wrap inline-flex h-8 w-8 rounded-full"></span>
        <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-[var(--bg-surface)] bg-[var(--status-success)]" aria-hidden="true"></span>
      </button>
    </div>

    <span class="h-6 w-px shrink-0 bg-[var(--border-subtle)]" aria-hidden="true"></span>

    <p id="ep-dock-mic-status" role="alert" aria-live="assertive" class="hidden w-full basis-full px-1 text-[11px] font-medium text-[var(--status-danger)]"></p>
    <form id="ep-dock-form" data-no-lock class="flex flex-1 min-w-0 items-center gap-1.5">
      <input id="ep-dock-input" type="text" autocomplete="off" placeholder="Select an agent or type a message..." aria-label="Message AI assistant" class="w-20 sm:w-44 min-w-0 flex-1 bg-transparent px-1.5 py-1 text-xs text-[var(--text-primary)] placeholder:text-[var(--text-muted)] focus:outline-none">
      <button id="ep-dock-mic" type="button" title="Voice input" aria-label="Voice input" aria-pressed="false" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-[var(--border-subtle)] bg-[var(--bg-canvas)] text-[var(--text-secondary)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--accent-primary)]">
        <i class="fa-solid fa-microphone text-xs pointer-events-none" aria-hidden="true"></i>
      </button>
      <button id="ep-dock-send" type="submit" title="Send message" aria-label="Send message" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[var(--accent-primary)] text-white shadow-sm transition-colors hover:bg-[var(--accent-hover)] disabled:opacity-50">
        <i class="fa-solid fa-paper-plane text-xs" aria-hidden="true"></i>
      </button>
    </form>
  </div>

  <button id="ep-agent-dock-toggle" type="button" title="Drag to move or click to open AI Assistants" aria-label="AI Assistants" aria-expanded="false" aria-controls="ep-message-dock" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-[var(--border-subtle)] bg-[var(--accent-primary)] text-white shadow-md hover:bg-[var(--accent-hover)] cursor-grab active:cursor-grabbing select-none touch-none transition-transform active:scale-95">
    <svg class="ep-toggle-avatar-anim h-7 w-7 pointer-events-none" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <g class="ep-bot-head">
        <path d="M16 3.5v3.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="3.2" r="1.9" fill="#ffffff"/>
        <rect x="5" y="8" width="22" height="18" rx="8" fill="#ffffff"/>
        <ellipse class="ep-bot-eye" cx="12" cy="16.5" rx="2" ry="2.4" fill="var(--accent-primary)"/>
        <ellipse class="ep-bot-eye" cx="20" cy="16.5" rx="2" ry="2.4" fill="var(--accent-primary)"/>
        <path d="M12.5 21q3.5 3 7 0" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </svg>
  </button>
</div>
