<div data-gradient-uploader data-max-mb="{{ max_mb|default:5 }}" data-initial-preview="{{ preview_url|default:'' }}" class="ep-gradient-upload rounded-xl p-3 space-y-2.5 transition-all">
  <div data-uploader-dropzone role="button" tabindex="0" aria-label="{{ title|default:'Upload File' }}" class="group flex flex-col items-center justify-center gap-2 rounded-lg border border-dashed border-[var(--border-subtle)] bg-[var(--bg-surface)]/80 px-3 py-4 text-center transition-colors hover:border-[var(--accent-primary)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent-primary)]">
    <input id="{{ input_id|default:'ep-upload-file' }}" name="{{ input_name|default:'file' }}" type="file"{% if accept %} accept="{{ accept }}"{% endif %}{% if auto_submit %} data-auto-submit="true"{% endif %} data-uploader-input class="sr-only">
    <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-[var(--border-subtle)] bg-[var(--accent-soft)] text-[var(--accent-primary)] transition-transform group-hover:scale-105" aria-hidden="true">
      <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
    </span>
    <div class="space-y-0.5 min-w-0">
      <p class="text-xs font-semibold text-[var(--text-primary)]">{{ title|default:"Upload File" }}</p>
      <p class="text-[11px] text-[var(--text-muted)]">{{ subtitle|default:"Drag and drop or browse your device" }}</p>
    </div>
    <button type="button" data-uploader-browse class="inline-flex items-center gap-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2.5 py-1 text-[11px] font-semibold text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-colors">
      <i class="fa-regular fa-folder-open text-[10px] text-[var(--accent-primary)]" aria-hidden="true"></i>
      <span>Choose File</span>
    </button>
  </div>

  <div data-uploader-preview class="{% if not preview_url %}hidden {% endif %}rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-2.5 space-y-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <img data-uploader-img src="{{ preview_url|default:'' }}" alt="Selected file preview" class="{% if not preview_url %}hidden {% endif %}h-10 w-10 shrink-0 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] object-cover">
      <div class="min-w-0 flex-1">
        <p data-uploader-name class="truncate text-xs font-semibold text-[var(--text-primary)]">{% if preview_url %}Current profile photo{% else %}No file selected{% endif %}</p>
        <p data-uploader-meta class="truncate text-[11px] text-[var(--text-muted)]">{% if preview_url %}Hosted on Cloudinary{% else %}Max {{ max_mb|default:5 }} MB{% endif %}</p>
      </div>
      <button type="button" data-uploader-clear aria-label="Clear selected file" title="Clear selected file" class="hidden inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] text-[var(--text-muted)] hover:bg-[var(--bg-elevated)] hover:text-[var(--status-danger)] transition-colors">
        <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
      </button>
    </div>
    <div class="h-1 w-full overflow-hidden rounded-full bg-[var(--bg-elevated)]">
      <div data-upload-progress class="h-full {% if preview_url %}w-full{% else %}w-0{% endif %} rounded-full bg-[var(--accent-primary)] transition-all duration-300"></div>
    </div>
  </div>
</div>
