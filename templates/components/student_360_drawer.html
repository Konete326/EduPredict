<div id="student-360-drawer" data-ep-modal class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="s360-name" aria-hidden="true">
  <div data-modal-backdrop="student-360-drawer" class="fixed inset-0 bg-[var(--bg-overlay)] backdrop-blur-sm"></div>
  <div class="ep-drawer-panel relative z-10 ml-auto flex h-full w-full max-w-lg flex-col border-l border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-2xl">
    <div class="flex shrink-0 items-center justify-between gap-3 border-b border-[var(--border-subtle)] px-5 py-3.5 bg-[var(--bg-surface)]">
      <div class="flex items-center gap-3 min-w-0">
        <div id="s360-avatar" class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-full border border-[var(--border-subtle)] bg-[var(--accent-soft)] text-sm font-bold text-[var(--accent-primary)]">ST</div>
        <div class="min-w-0 space-y-1">
          <h3 id="s360-name" class="truncate text-base font-bold text-[var(--text-primary)]">Student 360° Summary</h3>
          <div class="flex flex-wrap items-center gap-1.5">
            <button id="s360-id" type="button" data-copy-text="" title="Copy Student ID" class="inline-flex items-center gap-1 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2 py-0.5 font-mono text-[11px] font-medium text-[var(--text-secondary)] hover:border-[var(--accent-primary)] hover:text-[var(--accent-primary)] transition-colors">
              <span>-</span>
              <i class="fa-regular fa-copy text-[10px]" aria-hidden="true"></i>
            </button>
            <span id="s360-risk-badge" class="inline-flex items-center gap-1.5 rounded-full border border-[var(--border-subtle)] bg-[var(--bg-elevated)] px-2 py-0.5 text-[11px] font-semibold text-[var(--text-secondary)]">
              <span class="h-1.5 w-1.5 rounded-full bg-[var(--accent-primary)]" aria-hidden="true"></span>
              <span>Checking...</span>
            </span>
          </div>
        </div>
      </div>
      <button type="button" onclick="closeStudent360Drawer()" aria-label="Close student summary" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[var(--text-muted)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
        <i class="fa-solid fa-xmark text-sm" aria-hidden="true"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-4">
      <div id="s360-loading" class="flex flex-col items-center justify-center gap-2.5 py-12 text-xs text-[var(--text-muted)]">
        <i class="fa-solid fa-spinner fa-spin text-lg text-[var(--accent-primary)]" aria-hidden="true"></i>
        <span>Loading Student 360° profile...</span>
      </div>

      <div id="s360-error" class="hidden rounded-xl border border-[var(--status-danger)] bg-[var(--bg-canvas)] px-4 py-3 text-xs text-[var(--status-danger)]"></div>

      <div id="s360-body" class="hidden space-y-4">
        <div class="flex items-center gap-4 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-canvas)] p-3.5">
          <div class="relative flex h-20 w-20 shrink-0 items-center justify-center">
            <svg viewBox="0 0 80 80" class="h-20 w-20" aria-hidden="true">
              <circle cx="40" cy="40" r="32" fill="none" stroke="var(--border-subtle)" stroke-width="6"></circle>
              <circle id="s360-att-ring" cx="40" cy="40" r="32" fill="none" stroke="var(--accent-primary)" stroke-width="6" stroke-linecap="round" stroke-dasharray="201.06" stroke-dashoffset="201.06" transform="rotate(-90 40 40)" style="transition: stroke-dashoffset 450ms ease, stroke 200ms ease;"></circle>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span id="s360-att-pct" class="font-mono text-xs font-bold tabular-nums text-[var(--text-primary)]">0%</span>
              <span class="text-[9px] font-medium uppercase tracking-wider text-[var(--text-muted)]">Attend</span>
            </div>
          </div>
          <div class="grid flex-1 grid-cols-3 gap-2 min-w-0">
            <div class="rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-2.5 min-w-0">
              <p class="text-[10px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">Pred. GPA</p>
              <p id="s360-gpa" class="mt-0.5 font-mono text-sm font-bold tabular-nums text-[var(--text-primary)]">-</p>
            </div>
            <div class="rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-2.5 min-w-0">
              <p class="text-[10px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">Avg Marks</p>
              <p id="s360-marks" class="mt-0.5 font-mono text-sm font-bold tabular-nums text-[var(--text-primary)]">-</p>
            </div>
            <div class="rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-2.5 min-w-0">
              <p class="text-[10px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">Batch</p>
              <p id="s360-batch" class="mt-0.5 truncate font-mono text-xs font-semibold text-[var(--text-primary)]">-</p>
            </div>
          </div>
        </div>

        <div class="space-y-2 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-canvas)] p-3.5">
          <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)]">
            <i class="fa-solid fa-wand-magic-sparkles text-[11px] text-[var(--accent-primary)]" aria-hidden="true"></i>
            <span>AI Risk Signals</span>
          </div>
          <ul id="s360-reasons" class="space-y-1.5 text-xs text-[var(--text-secondary)]"></ul>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)]">Courses &amp; Scores</p>
          <div id="s360-courses" class="space-y-2"></div>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)]">Recent Alerts</p>
          <div id="s360-alerts" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <div class="flex shrink-0 flex-wrap items-center justify-between gap-2 border-t border-[var(--border-subtle)] px-5 py-3.5 bg-[var(--bg-surface)]">
      <div class="flex flex-wrap items-center gap-2">
        <button id="s360-edit-marks-btn" type="button" class="hidden inline-flex items-center gap-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-3 py-1.5 text-xs font-semibold text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-colors">
          <i class="fa-solid fa-pen-to-square text-[11px] text-[var(--accent-primary)]" aria-hidden="true"></i>
          <span>Update Marks</span>
        </button>
        <button id="s360-send-alert-btn" type="button" class="hidden inline-flex items-center gap-1.5 rounded-lg bg-[var(--accent-primary)] px-3 py-1.5 text-xs font-semibold text-white hover:bg-[var(--accent-hover)] transition-colors">
          <i class="fa-solid fa-bell text-[11px]" aria-hidden="true"></i>
          <span>Send Alert</span>
        </button>
      </div>
      <button type="button" onclick="closeStudent360Drawer()" class="ml-auto inline-flex items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-3.5 py-1.5 text-xs font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)] transition-colors">Close</button>
    </div>
  </div>
</div>
