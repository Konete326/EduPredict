<div id="ep-tearoff-calendar-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[var(--bg-overlay)] p-3 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="toc-month-heading">
  <div class="toc-root relative w-full max-w-[820px] select-none rounded-[28px] border border-[var(--border-subtle)] bg-[var(--bg-elevated)] p-2.5 text-[var(--text-primary)] shadow-2xl sm:p-3">
    <button type="button" id="toc-close-x" aria-label="Close calendar" class="absolute right-4 top-4 z-40 inline-flex h-8 w-8 items-center justify-center rounded-full border border-[var(--border-subtle)] bg-[var(--bg-surface)] text-xs text-[var(--text-secondary)] shadow-sm hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="grid gap-2.5 md:grid-cols-[minmax(0,264px)_minmax(0,1fr)] md:gap-3">
      <aside class="toc-side-panel relative flex flex-col overflow-hidden rounded-[22px] p-4 text-white sm:p-5">
        <span aria-hidden="true" class="pointer-events-none absolute -right-14 -top-20 h-56 w-56 rounded-full" style="background: radial-gradient(closest-side, rgba(255,255,255,.28), rgba(255,255,255,0));"></span>

        <div class="relative flex h-7 items-center justify-between text-[11px] font-semibold uppercase tracking-[0.14em] text-white/85">
          <span id="toc-side-month-year">NOV 2026</span>
          <button type="button" id="toc-today-btn" class="rounded-full bg-white/15 px-3 py-1 text-[11px] font-semibold normal-case tracking-normal text-white hover:bg-white/25">Today</button>
        </div>

        <div class="relative mt-2 flex items-center gap-4 md:mt-4 md:flex-col md:gap-0">
          <div id="toc-big-day" class="toc-big text-[68px] md:text-[112px]">28</div>
          <div class="min-w-0 md:mt-2 md:text-center">
            <p id="toc-side-weekday" class="truncate text-base font-medium uppercase tracking-[0.18em]">Saturday</p>
            <p id="toc-side-full-date" class="mt-0.5 text-xs text-white/75">2026-11-28</p>
          </div>
        </div>

        <div class="relative mt-4 hidden flex-1 flex-col justify-end pt-3 md:flex">
          <p class="text-xs font-semibold text-white/95">Pinned notes</p>
          <ul id="toc-side-notes" class="mt-1.5 space-y-1 text-xs text-white/90"></ul>
        </div>

        <div id="toc-note-editor" class="relative mt-3 hidden rounded-xl bg-black/20 p-2.5 backdrop-blur-sm">
          <div class="flex items-center justify-between gap-2">
            <span id="toc-note-date-label" class="text-[11px] font-semibold text-white/90">Note</span>
            <div class="flex items-center gap-1.5" id="toc-note-colors">
              <button type="button" data-note-color="yellow" aria-label="Yellow" class="h-4 w-4 rounded-full border border-white/60" style="background:#ffd83d"></button>
              <button type="button" data-note-color="pink" aria-label="Pink" class="h-4 w-4 rounded-full border border-white/60" style="background:#ff9dc3"></button>
              <button type="button" data-note-color="mint" aria-label="Mint" class="h-4 w-4 rounded-full border border-white/60" style="background:#8ee5b0"></button>
              <button type="button" data-note-color="sky" aria-label="Sky" class="h-4 w-4 rounded-full border border-white/60" style="background:#9bcdff"></button>
            </div>
          </div>
          <textarea id="toc-note-input" rows="2" maxlength="84" placeholder="Write a quick note..." class="mt-1.5 w-full resize-none rounded-lg border border-white/20 bg-white/15 px-2.5 py-1.5 text-xs text-white placeholder:text-white/60 focus:outline-none focus:ring-1 focus:ring-white/60"></textarea>
          <div class="mt-1.5 flex items-center justify-end gap-1.5">
            <button type="button" id="toc-note-delete" class="rounded-md bg-white/10 px-2 py-1 text-[11px] font-medium text-white hover:bg-white/20">Remove</button>
            <button type="button" id="toc-note-save" class="rounded-md bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-900 hover:bg-white/90">Save</button>
          </div>
        </div>

        <button type="button" id="toc-pin-btn" class="relative mt-3 flex items-center justify-between border-b border-white/70 pb-1.5 pt-1 text-left text-xs italic text-white hover:border-white">
          <span id="toc-pin-label">Pin a note on the 28</span>
          <span class="grid h-5 w-5 place-items-center rounded-full border border-white/90 text-[10px] not-italic">
            <i class="fa-solid fa-plus"></i>
          </span>
        </button>
      </aside>

      <div class="relative flex flex-col justify-between pb-1 pr-1">
        <div class="relative isolate h-[370px] sm:h-[400px]">
          <span aria-hidden="true" class="absolute inset-x-0 bottom-0 top-3 rounded-[8px] border border-[var(--border-subtle)] bg-[var(--bg-surface)] opacity-70" style="transform: translate(4px, 6px) rotate(0.3deg);"></span>
          <span aria-hidden="true" class="absolute inset-x-0 bottom-0 top-3 rounded-[8px] border border-[var(--border-subtle)] bg-[var(--bg-surface)] opacity-85" style="transform: translate(2px, 3px) rotate(-0.2deg);"></span>

          <div id="toc-sheet-host" class="relative h-full w-full overflow-hidden">
            <div id="toc-active-sheet" class="toc-paper absolute inset-0 flex flex-col px-4 pb-2.5 pt-11 sm:px-5">
              <span aria-hidden="true" class="toc-perf"></span>

              <div class="flex items-baseline justify-between gap-3">
                <h3 id="toc-month-heading" class="text-2xl font-bold leading-none tracking-tight text-[var(--text-primary)]">November <span class="font-light text-[var(--text-muted)]">2026</span></h3>
                <span id="toc-sheet-counter" class="hidden text-[11px] font-semibold uppercase tracking-[0.12em] text-[var(--text-muted)] sm:block">Sheet 11/12</span>
              </div>

              <div id="toc-month-ticks" class="mt-2.5 grid grid-cols-12 text-center text-[11px] font-medium"></div>

              <div class="mt-2 grid grid-cols-7 border-t border-[var(--border-subtle)] pt-2 text-center text-[10px] font-semibold uppercase tracking-[0.12em] text-[var(--text-muted)]">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
              </div>

              <div id="toc-day-grid" role="grid" class="mt-1 grid min-h-0 flex-1 grid-cols-7 grid-rows-6"></div>

              <button type="button" id="toc-tear-pull-btn" class="mt-1 flex h-5 shrink-0 items-center justify-center gap-1.5 text-[10px] font-semibold uppercase tracking-[0.18em] text-[var(--text-muted)] hover:text-[var(--accent-primary)]">
                <i class="fa-solid fa-angles-down toc-pull-icon"></i>
                <span>Pull to tear off</span>
              </button>
            </div>
            <div id="toc-crumb-host" aria-hidden="true" class="pointer-events-none absolute inset-0"></div>
          </div>

          <div class="toc-binding-strip absolute inset-x-0 top-0 flex items-center justify-between rounded-t-[10px] px-2.5">
            <button type="button" id="toc-prev-month" class="toc-strip-btn" aria-label="Previous month" title="Put last sheet back">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span aria-hidden="true" class="flex items-center gap-12 sm:gap-16">
              <span class="toc-eyelet h-2.5 w-2.5 rounded-full"></span>
              <span class="toc-eyelet h-2.5 w-2.5 rounded-full"></span>
            </span>
            <button type="button" id="toc-next-month" class="toc-strip-btn" aria-label="Tear off this month" title="Tear off this month">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="mt-3 flex flex-wrap items-center justify-between gap-2 px-1">
          <button type="button" id="toc-clear-btn" class="inline-flex h-8 items-center rounded-[10px] border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-3 text-xs font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-canvas)] hover:text-[var(--text-primary)]">Clear</button>
          <div class="flex items-center gap-2">
            <button type="button" id="toc-cancel-btn" class="inline-flex h-8 items-center rounded-[10px] border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-3.5 text-xs font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-canvas)] hover:text-[var(--text-primary)]">Cancel</button>
            <button type="button" id="toc-apply-btn" class="inline-flex h-8 items-center gap-1.5 rounded-[10px] bg-[var(--accent-primary)] px-4 text-xs font-semibold text-white shadow-sm hover:bg-[var(--accent-hover)]">
              <i class="fa-solid fa-check"></i>
              <span>Apply Date</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
