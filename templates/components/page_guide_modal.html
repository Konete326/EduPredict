<div id="page-guide-modal" class="hidden fixed inset-0 z-50 items-center justify-center overflow-y-auto overflow-x-hidden p-3 sm:p-4 md:p-6" role="dialog" aria-modal="true" aria-labelledby="page-guide-title" aria-hidden="true">
  <div data-modal-backdrop="page-guide-modal" class="fixed inset-0 bg-[var(--bg-overlay)] backdrop-blur-sm transition-opacity"></div>
  <div class="relative z-10 flex min-h-full w-full items-center justify-center pointer-events-none">
    <div class="pointer-events-auto relative w-full max-w-2xl mx-auto my-auto flex flex-col rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-2xl overflow-hidden max-h-[90vh]">
      <div class="flex shrink-0 items-center justify-between gap-3 border-b border-[var(--border-subtle)] px-5 py-3.5 bg-[var(--bg-surface)]">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-[var(--accent-soft)] text-[var(--accent-primary)]">
            <i class="fa-solid fa-circle-question text-sm"></i>
          </span>
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <h3 id="page-guide-title" class="truncate text-base font-semibold text-[var(--text-primary)]">Page Guide</h3>
              <span class="inline-flex items-center rounded-md bg-[var(--accent-soft)] px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-[var(--accent-primary)]">Interactive Guide</span>
            </div>
          </div>
        </div>
        <button type="button" onclick="closePageGuideModal()" aria-label="Close page guide" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[var(--text-muted)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)]">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2 border-b border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-5 py-2.5">
        <button type="button" data-guide-step="0" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors">1. Overview</button>
        <button type="button" data-guide-step="1" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors">2. How to Use</button>
        <button type="button" data-guide-step="2" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors">3. Quick FAQs</button>
      </div>

      <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">
        <div class="flex items-center justify-between gap-2">
          <p id="page-guide-step-heading" class="text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)]">Overview</p>
          <button id="page-guide-skip-btn" type="button" class="inline-flex items-center gap-1 rounded-md border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2.5 py-1 text-[11px] font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)] transition-colors">
            <i class="fa-solid fa-forward text-[10px]"></i>
            <span>Skip typing</span>
          </button>
        </div>

        <div class="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-canvas)] p-4 text-sm leading-relaxed text-[var(--text-primary)] min-h-[6.5rem]">
          <span id="page-guide-typewriter" aria-live="polite" class="whitespace-pre-line"></span><span id="page-guide-cursor" class="inline-block w-1.5 h-4 ml-0.5 align-middle bg-[var(--accent-primary)] animate-pulse" aria-hidden="true"></span>
        </div>

        <div id="page-guide-faq-list" class="hidden space-y-2"></div>
      </div>

      <div class="flex shrink-0 items-center justify-between gap-3 border-t border-[var(--border-subtle)] px-5 py-3.5 bg-[var(--bg-surface)]">
        <span id="page-guide-step-counter" class="text-xs font-medium text-[var(--text-muted)]">Step 1 of 3</span>
        <div class="flex items-center gap-2">
          <button id="page-guide-prev-btn" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-surface)] px-3.5 py-2 text-xs font-medium text-[var(--text-primary)] transition-colors hover:bg-[var(--bg-elevated)] disabled:opacity-40 disabled:pointer-events-none">
            <i class="fa-solid fa-arrow-left text-[11px]"></i>
            <span>Previous</span>
          </button>
          <button id="page-guide-next-btn" type="button" class="inline-flex items-center justify-center gap-1.5 rounded-lg bg-[var(--accent-primary)] px-4 py-2 text-xs font-semibold text-white transition-colors hover:bg-[var(--accent-hover)]">
            <span>Next</span>
            <i class="fa-solid fa-arrow-right text-[11px]"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
