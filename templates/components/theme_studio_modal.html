<div id="theme-studio-modal" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto overflow-x-hidden p-3 sm:p-5" role="dialog" aria-modal="true" aria-labelledby="theme-studio-modal-title" aria-hidden="true">
  <div data-modal-backdrop="theme-studio-modal" class="fixed inset-0 bg-[var(--bg-overlay)] backdrop-blur-sm transition-opacity"></div>
  <div class="relative z-10 flex min-h-full w-full items-center justify-center pointer-events-none">
    <div class="pointer-events-auto relative w-full max-w-xl mx-auto my-auto flex flex-col rounded-[16px] border border-[var(--border-subtle)] bg-[var(--bg-surface)] shadow-2xl overflow-hidden max-h-[90vh]">
      <div class="flex shrink-0 items-center justify-between gap-3 border-b border-[var(--border-subtle)] bg-[var(--bg-surface)] px-5 py-3.5">
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-palette text-sm text-[var(--accent-primary)] shrink-0" aria-hidden="true"></i>
            <h2 id="theme-studio-modal-title" class="text-base font-semibold text-[var(--text-primary)]">Theme &amp; Colors</h2>
            <span id="theme-studio-save-pill" class="inline-flex items-center gap-1 rounded-full bg-[var(--bg-elevated)] px-2 py-0.5 text-[11px] font-medium text-[var(--status-success)]">
              <i class="fa-solid fa-check text-[10px]" aria-hidden="true"></i>
              <span>Saved</span>
            </span>
          </div>
          <p class="mt-0.5 text-xs text-[var(--text-muted)]">Choose light or dark mode, sidebar style, and main color.</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="theme-studio-reset-btn" type="button" class="inline-flex h-8 items-center gap-1.5 rounded-[10px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-2.5 text-xs font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)] transition-colors cursor-pointer">
            <i class="fa-solid fa-rotate-left text-[11px]" aria-hidden="true"></i>
            <span>Reset</span>
          </button>
          <button type="button" onclick="closeThemeStudioModal()" aria-label="Close" class="inline-flex h-8 w-8 items-center justify-center rounded-[10px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] text-[var(--text-muted)] hover:bg-[var(--bg-elevated)] hover:text-[var(--text-primary)] transition-colors cursor-pointer">
            <i class="fa-solid fa-xmark text-sm" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <div class="space-y-2">
          <p class="text-xs font-semibold text-[var(--text-secondary)]">Mode</p>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" data-theme-mode="light" aria-pressed="{% if theme_prefs.mode != 'dark' %}true{% else %}false{% endif %}" class="flex items-center justify-between rounded-[12px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-3.5 py-2.5 text-xs font-semibold text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-colors cursor-pointer">
              <span class="inline-flex items-center gap-2"><i class="fa-solid fa-sun text-[var(--status-warning)]" aria-hidden="true"></i><span>Light</span></span>
              <i data-check-icon class="fa-solid fa-circle-check text-xs text-[var(--accent-primary)]" aria-hidden="true"></i>
            </button>
            <button type="button" data-theme-mode="dark" aria-pressed="{% if theme_prefs.mode == 'dark' %}true{% else %}false{% endif %}" class="flex items-center justify-between rounded-[12px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-3.5 py-2.5 text-xs font-semibold text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-colors cursor-pointer">
              <span class="inline-flex items-center gap-2"><i class="fa-solid fa-moon text-[var(--accent-primary)]" aria-hidden="true"></i><span>Dark</span></span>
              <i data-check-icon class="fa-solid fa-circle-check text-xs text-[var(--accent-primary)]" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-semibold text-[var(--text-secondary)]">Sidebar &amp; Header</p>
          <div class="grid grid-cols-3 gap-2">
            {% for st in theme_catalog.shell_themes %}
            <button type="button" data-shell-theme-btn="{{ st.slug }}" aria-pressed="{% if theme_prefs.shell_theme == st.slug %}true{% else %}false{% endif %}" class="flex items-center justify-between gap-1.5 rounded-[12px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-3 py-2 text-xs font-medium text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-colors cursor-pointer">
              <span class="inline-flex items-center gap-2 min-w-0">
                <span class="h-2.5 w-2.5 shrink-0 rounded-full border border-black/15" style="background-color: {{ st.dot_color }};"></span>
                <span class="truncate">{{ st.label }}</span>
              </span>
              <i data-check-icon class="fa-solid fa-check text-[10px] shrink-0 text-[var(--accent-primary)]" aria-hidden="true"></i>
            </button>
            {% endfor %}
          </div>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-semibold text-[var(--text-secondary)]">Main Color</p>
          <div class="flex flex-wrap items-center gap-2.5 rounded-[12px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] p-3">
            {% for sw in theme_catalog.swatches %}
            <button type="button" data-accent-swatch="{{ sw.slug }}" title="{{ sw.label }}" aria-label="{{ sw.label }}" aria-pressed="{% if theme_prefs.accent == sw.slug %}true{% else %}false{% endif %}" class="relative flex h-7 w-7 items-center justify-center rounded-full border border-black/15 transition-transform hover:scale-110 cursor-pointer" style="background-color: {{ sw.hex }};">
              <i data-check-icon class="fa-solid fa-check text-[11px] text-white drop-shadow" aria-hidden="true"></i>
            </button>
            {% endfor %}
          </div>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-semibold text-[var(--text-secondary)]">Spacing</p>
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" data-theme-density="comfortable" aria-pressed="{% if theme_prefs.density != 'compact' %}true{% else %}false{% endif %}" class="flex items-center justify-between rounded-[12px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-3.5 py-2 text-xs font-medium text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-colors cursor-pointer">
              <span>Normal</span>
              <i data-check-icon class="fa-solid fa-check text-[10px] text-[var(--accent-primary)]" aria-hidden="true"></i>
            </button>
            <button type="button" data-theme-density="compact" aria-pressed="{% if theme_prefs.density == 'compact' %}true{% else %}false{% endif %}" class="flex items-center justify-between rounded-[12px] border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-3.5 py-2 text-xs font-medium text-[var(--text-primary)] hover:bg-[var(--bg-elevated)] transition-colors cursor-pointer">
              <span>Compact</span>
              <i data-check-icon class="fa-solid fa-check text-[10px] text-[var(--accent-primary)]" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
