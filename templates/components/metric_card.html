<div data-dot-kpi data-status="{{ status|default:'info' }}" data-kpi-value="{{ value }}" data-kpi-label="{{ title }}"{% if dot_series %} data-dot-series="{{ dot_series }}"{% endif %} class="ep-dot-kpi-card group relative flex flex-col justify-between overflow-hidden rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-4 shadow-sm transition-colors hover:border-[var(--accent-primary)]">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0 flex-1">
      <p class="truncate text-[11px] font-semibold uppercase tracking-wider text-[var(--text-muted)]">{{ title }}</p>
      <p data-kpi-counter class="mt-1 tabular-nums text-2xl font-semibold tracking-tight text-[var(--text-primary)] sm:text-3xl">{{ value }}</p>
    </div>
    {% if icon %}
    <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-elevated)] text-xs {% if status == 'success' %}text-[var(--status-success)]{% elif status == 'warning' %}text-[var(--status-warning)]{% elif status == 'danger' or status == 'error' %}text-[var(--status-danger)]{% else %}text-[var(--accent-primary)]{% endif %}" aria-hidden="true">
      <i class="{{ icon }}"></i>
    </span>
    {% endif %}
  </div>
  <div class="my-2.5 h-px w-full bg-[var(--border-subtle)]"></div>
  <div class="relative pt-2">
    <div data-dot-tooltip class="ep-dot-tooltip"></div>
    <div data-dot-matrix class="ep-dot-matrix" aria-hidden="true"></div>
  </div>
  {% if badge or subtitle %}
  <div class="mt-2.5 flex flex-wrap items-center justify-between gap-2">
    {% if badge %}
    <span class="inline-flex items-center gap-1.5 rounded-md border border-[var(--border-subtle)] bg-[var(--bg-elevated)] px-2 py-0.5 text-[11px] font-medium text-[var(--text-secondary)]">
      <span class="h-1.5 w-1.5 rounded-full {% if status == 'success' %}bg-[var(--status-success)]{% elif status == 'warning' %}bg-[var(--status-warning)]{% elif status == 'danger' or status == 'error' %}bg-[var(--status-danger)]{% else %}bg-[var(--accent-primary)]{% endif %}" aria-hidden="true"></span>
      <span>{{ badge }}</span>
    </span>
    {% endif %}
    {% if subtitle %}
    <p class="truncate text-[11px] text-[var(--text-muted)]">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% endif %}
</div>
